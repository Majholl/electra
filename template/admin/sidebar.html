
<aside class="left-sidebar">

    
        <section class="inner-left-sidebar">

            <a class="rel-dashboard" href="{% url 'AdminDashboard' %}">

                <div class="inner-left-sidebar admin">

                    <div class="user-panel">

                        <div class="admin-image-section">
                            <img src="{{ profile }}" class="admin-image-section img" alt="{{ username }}" width="75px" height="75px">
                        </div>

                        <div class="admin-info-section">
                            <i class="fa-solid fa-circle-user"></i>
                            <p class="admin-info-section p ">{{ username }}</p>
                        </div>

                    </div>

                </div>

            </a>

        </section>


<!-- need to be fix (bottom) -->

        <section>
        <ul class="sidebar-menu" data-widget="tree">

            {% if usertype == 'superadmin' %}
            <li class="sub-admins-page"> <a href="{% url 'AdminsList' %}"><i class="side-btn fa fa-dashboard"></i> <span>admins</span></a></li>
            {% endif %}
            <li class="vote-panels-page"><a href="{% url 'VotePanels' %}"><span class="fa fa-square-poll-vertical"></span> <span>voting panels</span></a></li>
            
            <li class="candidate-page"><a href="{% url 'candidatelist' %}"><i class="fa fa-users"></i> <span>candidate</span></a></li>
            
            <li class="votes-page"><a href="{% url 'all-votings' %}"><i class="fa fa-black-tie"></i> <span>votes</span></a></li>
    
           <li > exit() : <a href="{% url 'logoutFromSystem' %}">logout</a></li>
        </ul>
        

    </section>

</aside>


<style>

.left-sidebar {
        height: 100%;
        width: 200px;
        position: fixed;
        z-index: -1;
        top: 50px;
        left: 0px;
        background-color: #111;
        overflow-x: hidden;
        padding-top: 20px;
        }

.left-sidebar a {
    color: white;
    text-decoration: none;
    font-size: 18px;
    color: #818181;
    display: block;

}

.left-sidebar a:hover{
    color: #f1f1f1;
}


.rel-dashboard{
    display: grid;
    justify-items: center;
}

.inner-left-sidebar.admin {
    width: 100%;
}


.admin-image-section {
    text-align: center;
    margin-top: 10px;
}


.admin-image-section.img {
    border-radius: 20px;
}


.admin-info-section { 
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;    
    margin-top: 10px;
    margin-bottom: 25px;

}
.admin-info-section.p{
    font-size: 20px;
} 


.fa-circle-user{
    padding-bottom: 10px;
}




</style>
