




<div class="main-candidate">



    <div class="panel_candidate">

        <table class="candidate-table">
            <thead>
                <tr>
                    <th scope="col"> نام پنل </th>
                    <th scope="col"> تصویر پنل</th>
                    <th scope="col">نام کاندید</th>
                    <th scope="col">تصویر کاندید</th>
                </tr>
            </thead>

            {% for i in obj_list %}
            <tbody>
                <tr>

                    <th scope="row"> ‌{{ i.name }}</th>
                    <th scope="row">
                    {% if i.image %}
                    <img src="{{ i.image.url }}" alt="panel_image_{{ i.name }}_{{ i.pk }}" width="50px" height="50px">
                    {% endif %}</th>
                    

                    {% for j in i.candidate.all %}
                    <th scope="row"> {{ j.name }} </th>
                    <th scope="row">    
                            {% if j.image %}
                            <img src="{{ j.image.url }}" alt="panel_image_{{ i.name }}_{{ i.pk }}"  width="50px" height="50px">
                            {% endif %} </th>
                            
                    {% endfor %}
                </tr>
            </tbody>
            {% endfor %} 

        </table>



    </div>

</div>




<style>
.main-candidate {
    display: flex;
    width: 100%;
    
}

.panel_candidate {
    width: 100%;
}
</style>
