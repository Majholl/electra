

{% block votingpanel %}
<div class="new-vote-panel-section">



    <div class="addnew-vote-section">
    
        <button><a href="{% url 'VotePanels' %}">بازگشت به صفحه قبلی</a></button>
        
        <div class="modify-votepanel-section success-msg">
        
            {% if messages %}
            <div class="alert alert-warning d-flex align-items-center fade show" role="alert">
                {% for msg in messages %}
                <div>
                    {{ msg }}
                </div>
                {% endfor %}
                <i class="fa-solid fa-circle-check"></i>

            </div>
            {% endif %}    
        </div>

    </div>



    <form method="POST" action="{% url 'AddNewVotePanel' %}" accept="image/*" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="from-data-up">
            
            <label>نام پنل:</label>
            <input type="text" name="name" placeholder="یک نام انتخاب کنید" >
            
            <label>توضیحات پنل :</label>
            <input type="text" name="description" placeholder="توضیحات مناسب پنل را وارد کنید" >
            
        </div>


        <div class="changable-data">

            <div class="start_date-div">
                <label>تاریخ شروع </label>
                <input type="datetime-local" name="start_date">
            </div> 

            <div class="end_date-div">
                <label>تاریخ پایان </label>
                <input type="datetime-local" name="end_date">
            </div>
            
        </div>


        <div class="from-data-down">
            <label>عکس پنل</label>
            <input type="file" name="image" placeholder="یک تصویر برای انتخاب کنید"></br>
        </div>

        <button type="submit">ثبت</button><br>

    </form>

</div>

{% endblock %}

<style>


.addnew-vote-section {
    display: flex;
    align-items: center;
}


.addnew-vote-section button {
    background: #334155;
    border: none;
    border-radius: 15px;
    margin: 10px;
    padding: 15px;
    transition: border-radius;
    transition-delay: 200ms;
    transition-duration: 250ms;
}

.addnew-vote-section button:hover {
    border-radius: 5px;
}


.addnew-vote-section button a {
    text-decoration: none;
    color: white;
}

    width: 30%;
}

}

}

input { 
    border-radius: 10px;

}


</style>
