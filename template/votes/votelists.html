{% load static %}
{% load jalali_tags %}

<div class="dashboard-home-user">

    <div class="voteslist-tovote-section">

        {% for i in objs_list %}
        <div class="votepanels-tovote">

            {% if i.image %}
            <img src="{{ i.image.url }}" alt="{{ i.name }}">
            {% endif %}

            <div class="vote-info">

                <span class="vote-panel-name">{{ i.name }}</span>
                {% if i.is_active %}
                <button type="button" class="vote-panel-btn">
                    <a href="{% url 'LoadVotingsToVote' id=i.id %}">ثبت رای</a>
                </button>
                {% else %}
                <button type="button" class="vote-panel-btn" disabled>
                    <a href="">انتخابات غیرفعال</a>
                </button>
                {% endif %}
            </div>

        </div>

        {% endfor %}

    </div>
</div>
